<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>

  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">
    AI-Powered Customer Complaint Management — Architecture
  </text>

  <!-- Frontend -->
  <g>
    <rect x="60" y="90" width="260" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">React Frontend</text>
    <text x="190" y="146" text-anchor="middle" font-size="12.5" fill="#334155">Complaint form + AI copilot chat</text>
    <text x="190" y="166" text-anchor="middle" font-size="12.5" fill="#334155">Redux Toolkit (shared state)</text>
    <text x="190" y="186" text-anchor="middle" font-size="12.5" fill="#334155">Axios client</text>
  </g>

  <!-- FastAPI Router -->
  <g>
    <rect x="470" y="90" width="260" height="120" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
    <text x="600" y="122" text-anchor="middle" font-size="16" font-weight="700" fill="#065f46">FastAPI Router</text>
    <text x="600" y="146" text-anchor="middle" font-size="12.5" fill="#334155">/complaints/extract</text>
    <text x="600" y="166" text-anchor="middle" font-size="12.5" fill="#334155">/complaints/assess</text>
    <text x="600" y="186" text-anchor="middle" font-size="12.5" fill="#334155">/complaints/save</text>
  </g>

  <!-- request/response arrows -->
  <path d="M320,135 L470,135" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="395" y="122" text-anchor="middle" font-size="11.5" fill="#1e3a8a">multipart / JSON</text>

  <path d="M470,175 L320,175" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="395" y="198" text-anchor="middle" font-size="11.5" fill="#1e3a8a">JSON response</text>

  <!-- Down arrow to LangGraph -->
  <path d="M600,210 L600,265" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- LangGraph pipeline -->
  <g>
    <rect x="380" y="270" width="440" height="150" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="600" y="300" text-anchor="middle" font-size="16" font-weight="700" fill="#5b21b6">LangGraph Pipeline</text>
    <text x="600" y="323" text-anchor="middle" font-size="12" fill="#334155">decide_intent (extract vs. update)</text>
    <text x="600" y="343" text-anchor="middle" font-size="12" fill="#334155">→ choose_input (PDF vs. text)</text>
    <text x="600" y="363" text-anchor="middle" font-size="12" fill="#334155">→ extract_complaint / update_complaint</text>
    <text x="600" y="383" text-anchor="middle" font-size="12" fill="#334155">→ assess_risk</text>
    <text x="600" y="405" text-anchor="middle" font-size="11" fill="#7c3aed" font-style="italic">backend/complain_management/services.py</text>
  </g>

  <!-- Branch arrows down to 3 services -->
  <path d="M480,420 L200,510" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M600,420 L600,510" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M720,420 L1000,510" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Groq LLM -->
  <g>
    <rect x="60" y="515" width="280" height="130" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="200" y="547" text-anchor="middle" font-size="16" font-weight="700" fill="#9a3412">Groq LLM</text>
    <text x="200" y="571" text-anchor="middle" font-size="12.5" fill="#334155">Structured extraction</text>
    <text x="200" y="591" text-anchor="middle" font-size="12.5" fill="#334155">(schema-constrained JSON output)</text>
    <text x="200" y="611" text-anchor="middle" font-size="12.5" fill="#334155">Risk assessment generation</text>
  </g>

  <!-- Supabase Storage -->
  <g>
    <rect x="460" y="515" width="280" height="130" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="600" y="547" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Supabase Storage</text>
    <text x="600" y="571" text-anchor="middle" font-size="12.5" fill="#334155">Original PDF retention</text>
    <text x="600" y="591" text-anchor="middle" font-size="12.5" fill="#334155">(complaints/&lt;uuid&gt;-filename.pdf)</text>
  </g>

  <!-- Postgres -->
  <g>
    <rect x="860" y="515" width="280" height="130" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="1000" y="547" text-anchor="middle" font-size="16" font-weight="700" fill="#155e75">PostgreSQL</text>
    <text x="1000" y="571" text-anchor="middle" font-size="12.5" fill="#334155">complaints</text>
    <text x="1000" y="591" text-anchor="middle" font-size="12.5" fill="#334155">risk_assessments</text>
    <text x="1000" y="611" text-anchor="middle" font-size="12.5" fill="#334155">(FK: complaint_id, cascade delete)</text>
  </g>

  <!-- Legend -->
  <g>
    <rect x="60" y="690" width="14" height="14" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="82" y="701" font-size="12" fill="#334155">Frontend</text>

    <rect x="180" y="690" width="14" height="14" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <text x="202" y="701" font-size="12" fill="#334155">API Layer</text>

    <rect x="300" y="690" width="14" height="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="322" y="701" font-size="12" fill="#334155">Orchestration</text>

    <rect x="450" y="690" width="14" height="14" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
    <text x="472" y="701" font-size="12" fill="#334155">LLM</text>

    <rect x="540" y="690" width="14" height="14" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="562" y="701" font-size="12" fill="#334155">File Storage</text>

    <rect x="670" y="690" width="14" height="14" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
    <text x="692" y="701" font-size="12" fill="#334155">Database</text>
  </g>
</svg>
